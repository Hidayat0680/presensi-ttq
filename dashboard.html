<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Absensi Digital Pondok Pesantren Sidogiri</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Font Awesome untuk Ikon -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-[#CBEBF3] min-h-screen flex items-center justify-center p-4 relative font-sans">

  <!-- ========================================== -->
  <!-- 1. TOMBOL GERIGI & POP-UP MENU (KIRI)     -->
  <!-- ========================================== -->
  <div class="fixed top-6 left-6 z-50">
    
    <!-- Tombol Gerigi Utama -->
    <button id="gearBtn" onclick="toggleMenu()" class="bg-[#41BBEF] hover:bg-[#32A8DC] text-white p-3 rounded-2xl shadow-lg flex items-center justify-center transition-all duration-200">
      <i class="fa-solid fa-gear text-xl"></i>
    </button>

    <!-- Pop-up Menu Dropdown (Tersembunyi secara default, posisi pas di bawah gerigi) -->
    <div id="popupMenu" class="hidden mt-3 w-48 bg-white/80 backdrop-blur-md p-3 rounded-2xl shadow-2xl border border-white/60 flex flex-col space-y-2 transition-all">
      
      <!-- Tombol Kembali -->
      <button class="w-full bg-[#E63946] hover:bg-[#D62828] text-white font-semibold py-2.5 px-4 rounded-xl flex items-center space-x-3 shadow-md transition">
        <i class="fa-solid fa-arrow-left text-sm"></i>
        <span>Kembali</span>
      </button>

      <!-- Tombol Sakit / Perizinan -->
      <button class="w-full bg-[#0077FF] hover:bg-[#0066CC] text-white font-semibold py-2.5 px-4 rounded-xl flex items-center space-x-3 shadow-md transition">
        <i class="fa-solid fa-temperature-three-quarters text-sm"></i>
        <span>Sakit</span>
      </button>

    </div>
  </div>


  <!-- ========================================== -->
  <!-- 2. KARTU UTAMA (MAIN CARD ABSENSI)        -->
  <!-- ========================================== -->
  <div class="bg-white rounded-3xl shadow-xl w-full max-w-5xl grid grid-cols-1 md:grid-cols-2 overflow-hidden border border-white/50 my-auto">
    
    <!-- KOLOM KIRI: FORM INPUT & STATUS -->
    <div class="p-8 flex flex-col justify-between border-b md:border-b-0 md:border-r border-gray-100">
      <div>
        <!-- Status Indicator -->
        <div class="flex items-center space-x-3 text-xs font-semibold mb-6 flex-wrap gap-y-1">
          <span class="flex items-center text-emerald-600"><span class="w-2.5 h-2.5 rounded-full bg-emerald-500 mr-1.5"></span> Online</span>
          <span class="flex items-center text-rose-400"><span class="w-2.5 h-2.5 rounded-full bg-rose-400 mr-1.5"></span> Offline</span>
          <span class="flex items-center text-amber-500"><span class="w-2.5 h-2.5 rounded-full bg-amber-400 mr-1.5"></span> Pending <span class="bg-amber-100 text-amber-600 px-1.5 py-0.5 rounded-full text-[10px] ml-1">0</span></span>
          <span class="flex items-center text-sky-400"><span class="w-2.5 h-2.5 rounded-full bg-sky-400 mr-1.5"></span> Update</span>
        </div>

        <!-- Judul Aplikasi -->
        <h1 class="text-2xl md:text-3xl font-bold text-[#2CB1C3] leading-tight">
          Absensi Digital<br>Pondok Pesantren Sidogiri
        </h1>
        <h2 class="text-xl md:text-2xl font-bold text-[#FF6B4A] mt-1 mb-8">
          Koordinasi Kontroling
        </h2>

        <!-- Form Input ID -->
        <div class="relative">
          <input 
            type="text" 
            placeholder="Masukkan ID PPS/ ID Pengurus" 
            class="w-full px-4 py-3.5 rounded-xl border-2 border-[#81D4E0] focus:outline-none focus:border-[#2CB1C3] text-gray-700 font-medium placeholder-gray-400 pr-10 shadow-sm"
          >
          <div class="absolute inset-y-0 right-0 flex items-center pr-3 pointer-events-none text-gray-400">
            <i class="fa-solid fa-sort text-xs"></i>
          </div>
        </div>
      </div>

      <!-- Footer / Version -->
      <p class="text-xs text-gray-400 text-center mt-8">
        Copyright © By Team IT [BPSTI] 46-47 H <span class="text-rose-500">💖</span> V1.0.0
      </p>
    </div>

    <!-- KOLOM KANAN: PANEL PROFIL -->
    <div class="p-8 bg-white relative flex flex-col justify-between min-h-[320px]">
      
      <!-- Ornamen Pojok Kanan Atas -->
      <div class="absolute top-0 right-0 w-28 h-28 pointer-events-none">
        <svg viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M0 0H100V100C100 44.7715 55.2285 0 0 0Z" fill="#FBBF24" opacity="0.8"/>
          <path d="M30 0H100V70C100 31.3401 68.6599 0 30 0Z" fill="#F97316"/>
        </svg>
      </div>

      <!-- Header Profil & Jam -->
      <div class="flex justify-between items-center pb-4 border-b border-gray-100 z-10">
        <h3 class="text-2xl md:text-3xl font-bold text-gray-700">Profile</h3>
        <span class="text-lg md:text-xl font-bold text-emerald-600">07.15.00 WIS</span>
      </div>

      <!-- Area Tampilan Data / Foto Hasil Scan -->
      <div class="flex-1 flex flex-col items-center justify-center text-gray-400 py-6">
        <i class="fa-solid fa-id-card text-5xl mb-3 text-gray-200"></i>
        <p class="text-sm">Silahkan scan / masukkan ID untuk menampilkan profil</p>
      </div>

    </div>

  </div>

  <!-- JavaScript Toggle Pop-up Menu -->
  <script>
    function toggleMenu() {
      const popup = document.getElementById('popupMenu');
      popup.classList.toggle('hidden');
    }

    // Menutup menu jika mengklik di luar menu
    window.addEventListener('click', function(e) {
      const gearBtn = document.getElementById('gearBtn');
      const popup = document.getElementById('popupMenu');
      if (!gearBtn.contains(e.target) && !popup.contains(e.target)) {
        popup.classList.add('hidden');
      }
    });
  </script>

</body>
</html>
