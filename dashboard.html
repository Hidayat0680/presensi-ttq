          <label class="radio-label">
            <input type="radio" name="pilihanTanggal" value="tomorrow">

      <div class="form-group">

      </div>

      <div class="modal-footer">
        <button type="button" class="btn-batal" onclick="closeModalTambah()">Batal</button>

    </form>

</div>

<!-- 3. JAVASCRIPT (Handling F1 & Input Data)                          -->
<!-- ================================================================= -->
<script>
// Menangani Shortcut F1 tanpa mengganggu fungsi lain
document.addEventListener('keydown', function(event) {
  if (event.key === 'F1') {
    event.preventDefault();
    openModalTambah();
  }
});

function openModalTambah() {
  document.getElementById('modalTambahKegiatan').style.display = 'block';
  document.getElementById('namaKegiatan').focus();
}

function closeModalTambah() {
  document.getElementById('modalTambahKegiatan').style.display = 'none';
  document.getElementById('formTambahKegiatan').reset();
}

function simpanKegiatan(event) {
  event.preventDefault();

  const namaKegiatan = document.getElementById('namaKegiatan').value;
  const pilihanTanggal = document.querySelector('input[name="pilihanTanggal"]:checked').value;
  const fileInput = document.getElementById('fileExcel');

  if (fileInput.files.length === 0) {
    alert("Silakan pilih file Excel data peserta!");
    return;
  }

  const file = fileInput.files[0];
  const reader = new FileReader();

  reader.onload = function(e) {
    const data = new Uint8Array(e.target.result);
    const workbook = XLSX.read(data, { type: 'array' });
    const worksheet = workbook.Sheets[workbook.SheetNames[0]];
    const jsonPeserta = XLSX.utils.sheet_to_json(worksheet);
    const jumlahPeserta = jsonPeserta.length;

    let statusText = "Berlangsung";
    let statusBg = "#b37400"; // Orange bawaan tabel Anda

    if (pilihanTanggal === 'tomorrow') {
      statusText = "Mendatang";
      statusBg = "#4a5568"; // Abu-abu bawaan tabel Anda
    }

    tambahBarisKeTabel(namaKegiatan, jumlahPeserta, statusText, statusBg);
    closeModalTambah();
  };

  reader.readAsArrayBuffer(file);
}

// Menambahkan data baru ke tabel tanpa mengubah elemen aksi yang sudah ada
function tambahBarisKeTabel(nama, jumlah, statusText, statusBg) {
  const tbody = document.querySelector('table tbody'); 
  if (!tbody) return;

  const noUrut = tbody.children.length + 1;
  const tr = document.createElement('tr');

  tr.innerHTML = `
    <td>${noUrut}</td>
    <td>${nama}</td>
    <td><strong style="color: #00d2ff;">${jumlah}</strong> Peserta</td>
    <td><span style="padding: 3px 10px; border-radius: 4px; font-size: 12px; background-color: ${statusBg}; color: #fff;">${statusText}</span></td>
    <td>
      <!-- Aksi tombol sesuai style asli Anda -->
      <button style="background: none; border: none; color: #ffab00; cursor: pointer;">✏️</button>
      <button style="background: none; border: none; color: #00d2ff; cursor: pointer;">🔄</button>
      <button style="background: none; border: none; color: #ff5252; cursor: pointer;">🗑️</button>
    </td>
  `;

  tbody.appendChild(tr);
}
</script>
