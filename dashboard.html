<script>
// 1. Event Listener Shortcut Keyboard F1
document.addEventListener('keydown', function(event) {
  if (event.key === 'F1') {
    event.preventDefault(); // Menahan menu Bantuan bawaan browser
    openModalTambah();
  }
});

// Fungsi Buka Modal
function openModalTambah() {
  document.getElementById('modalTambahKegiatan').style.display = 'block';
  document.getElementById('namaKegiatan').focus();
}

// Fungsi Tutup Modal
function closeModalTambah() {
  document.getElementById('modalTambahKegiatan').style.display = 'none';
  document.getElementById('formTambahKegiatan').reset();
}

// 2. Fungsi Menangani Simpan Data Kegiatan
function simpanKegiatan(event) {
  event.preventDefault();

  const namaKegiatan = document.getElementById('namaKegiatan').value;
  const pilihanTanggal = document.querySelector('input[name="pilihanTanggal"]:checked').value;
  const fileInput = document.getElementById('fileExcel');

  if (fileInput.files.length === 0) {
    alert("Silakan pilih file Excel data peserta!");
    return;
  }

  const file = fileInput.files[0];
  const reader = new FileReader();

  // Membaca isi file Excel menggunakan library SheetJS
  reader.onload = function(e) {
    const data = new Uint8Array(e.target.result);
    const workbook = XLSX.read(data, { type: 'array' });

    // Ambil sheet pertama
    const firstSheetName = workbook.SheetNames[0];
    const worksheet = workbook.Sheets[firstSheetName];

    // Konversi isi sheet ke JSON untuk menghitung total peserta
    const jsonPeserta = XLSX.utils.sheet_to_json(worksheet);
    const jumlahPeserta = jsonPeserta.length;

    // Tentukan Status berdasarkan Pilihan Tanggal
    let statusText = "Berlangsung";
    let statusStyle = "background-color: #b37400; color: #fff;"; // Warna orange/kuning (Berlangsung)

    if (pilihanTanggal === 'tomorrow') {
      statusText = "Mendatang";
      statusStyle = "background-color: #4a5568; color: #fff;"; // Warna abu-abu (Mendatang)
    }

    // Tambahkan baris kegiatan baru ke Tabel Utama
    tambahBarisKeTabel(namaKegiatan, jumlahPeserta, statusText, statusStyle);

    alert(`Kegiatan "${namaKegiatan}" berhasil ditambahkan dengan ${jumlahPeserta} peserta!`);
    closeModalTambah();
  };

  reader.readAsArrayBuffer(file);
}

// 3. Fungsi Menambahkan Baris Baru ke Tabel Utama Secara Dinamis
function tambahBarisKeTabel(nama, jumlah, status, statusStyle) {
  const tbody = document.querySelector('table tbody'); 
  
  if (!tbody) return;

  const noUrut = tbody.children.length + 1;

  const tr = document.createElement('tr');
  tr.innerHTML = `
    <td>${noUrut}</td>
    <td>${nama}</td>
    <td><strong style="color: #00d2ff;">${jumlah}</strong> Peserta</td>
    <td><span style="padding: 4px 12px; border-radius: 4px; font-size: 12px; font-weight: bold; ${statusStyle}">${status}</span></td>
    <td>
      <!-- Aksi tombol bawaan sistem Anda -->
      <button style="background: none; border: none; color: #ffab00; cursor: pointer;">✏️</button>
      <button style="background: none; border: none; color: #00d2ff; cursor: pointer;">🔄</button>
      <button style="background: none; border: none; color: #ff5252; cursor: pointer;">🗑️</button>
    </td>
  `;

  tbody.appendChild(tr);
}
</script>
