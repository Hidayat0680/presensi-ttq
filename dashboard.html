<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Scan / Input ID PPS - Mode Gelap</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    /* Background Utama Tema Dark Dashboard */
    body {
      background-color: #0b1120;
      color: #e2e8f0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    /* Card Utama Dua Kolom */
    .main-card {
      background-color: #111827;
      border: 1px solid #1e293b;
      border-radius: 20px;
      width: 100%;
      max-width: 1050px;
      display: flex;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
      overflow: hidden;
      min-height: 420px;
    }

    /* Panel Kiri - Input ID & Status */
    .left-panel {
      flex: 1;
      padding: 40px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      border-right: 1px solid #1e293b;
      background-color: #111827;
    }

    /* Status Bar Indikator */
    .status-bar {
      display: flex;
      align-items: center;
      gap: 14px;
      font-size: 12px;
      font-weight: 700;
      margin-bottom: 25px;
    }

    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      display: inline-block;
      margin-right: 5px;
    }

    .status-online { color: #10b981; }
    .status-online .dot { background-color: #10b981; }

    .status-offline { color: #f87171; }
    .status-offline .dot { background-color: #f87171; }

    .status-pending { color: #f59e0b; }
    .status-pending .dot { background-color: #f59e0b; }

    .status-update { color: #38bdf8; }
    .status-update .dot { background-color: #38bdf8; }

    /* Judul Aplikasi */
    .title-main {
      color: #00d2ff;
      font-size: 28px;
      font-weight: 800;
      line-height: 1.25;
    }

    .title-sub {
      color: #ff6b4a;
      font-size: 24px;
      font-weight: 800;
      margin-top: 6px;
      margin-bottom: 30px;
    }

    /* Input Field ID PPS Mode Gelap */
    .input-box {
      width: 100%;
      padding: 14px 18px;
      background-color: #1e293b;
      border: 1px solid #334155;
      border-radius: 12px;
      font-size: 14px;
      outline: none;
      color: #f8fafc;
      transition: all 0.2s ease;
    }

    .input-box::placeholder {
      color: #64748b;
    }

    .input-box:focus {
      border-color: #00d2ff;
      box-shadow: 0 0 10px rgba(0, 210, 255, 0.2);
    }

    .footer-text {
      font-size: 11px;
      color: #64748b;
      text-align: center;
      margin-top: 30px;
    }

    /* Panel Kanan - Profil */
    .right-panel {
      flex: 1;
      padding: 40px;
      position: relative;
      display: flex;
      flex-direction: column;
      background-color: #131d31;
    }

    .profile-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #1e293b;
      padding-bottom: 15px;
    }

    .profile-title {
      font-size: 30px;
      font-weight: 800;
      color: #f8fafc;
    }

    .profile-time {
      font-size: 22px;
      font-weight: 800;
      color: #10b981;
    }

    /* Ornamen Pojok Kanan Atas */
    .ornament {
      position: absolute;
      top: 0;
      right: 0;
      width: 110px;
      height: 110px;
      pointer-events: none;
    }

    .profile-content {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #64748b;
      font-size: 14px;
    }

    @media (max-width: 768px) {
      .main-card {
        flex-direction: column;
      }
      .left-panel {
        border-right: none;
        border-bottom: 1px solid #1e293b;
      }
    }
  </style>
</head>
<body>

  <!-- KARTU UTAMA DUA KOLOM (DARK MODE) -->
  <div class="main-card">
    
    <!-- KOLOM KIRI: INPUT ID & STATUS -->
    <div class="left-panel">
      <div>
        <!-- Status Indicator -->
        <div class="status-bar">
          <span class="status-online"><span class="dot"></span>Online</span>
          <span class="status-offline"><span class="dot"></span>Offline</span>
          <span class="status-pending"><span class="dot"></span>Pending 0</span>
          <span class="status-update"><span class="dot"></span>Update</span>
        </div>

        <!-- Judul -->
        <div class="title-main">Absensi Digital<br>Pondok Pesantren Sidogiri</div>
        <div class="title-sub">Koordinasi Kontroling</div>

        <!-- Input Box ID PPS -->
        <input type="text" class="input-box" placeholder="Masukkan ID PPS/ ID Pengurus" autofocus>
      </div>

      <!-- Footer -->
      <div class="footer-text">
        Copyright © By Team IT [BPSTI] 46-47 H 💕 V1.0.0
      </div>
    </div>

    <!-- KOLOM KANAN: PROFIL PANEL -->
    <div class="right-panel">
      <!-- Ornamen Warna Pojok Kanan -->
      <svg class="ornament" viewBox="0 0 100 100" fill="none">
        <path d="M0 0H100V100C100 44.77 55.23 0 0 0Z" fill="#FBBF24" opacity="0.8"/>
        <path d="M30 0H100V70C100 31.34 68.66 0 30 0Z" fill="#F97316"/>
      </svg>

      <div class="profile-header">
        <div class="profile-title">Profile</div>
        <div class="profile-time">07.23.29 WIS</div>
      </div>

      <div class="profile-content">
        <!-- Area tempat menampilkan data hasil scan -->
        Silahkan scan / masukkan ID PPS
      </div>
    </div>

  </div>

</body>
</html>
