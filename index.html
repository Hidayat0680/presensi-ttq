<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Presensi TTQ</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background: linear-gradient(135deg, #e0f2fe, #f0fdf4); height: 100vh; display: flex; align-items: center; justify-content: center; }
    .login-card { background: #fff; padding: 40px; border-radius: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.05); width: 100%; max-width: 420px; }
    .login-card h2 { font-size: 24px; color: #1e293b; margin-bottom: 5px; }
    .login-card p.sub { color: #64748b; font-size: 14px; margin-bottom: 20px; }
    .alert { background: #dcfce7; border: 1px solid #86efac; color: #166534; padding: 12px; border-radius: 10px; font-size: 14px; margin-bottom: 20px; display: flex; align-items: center; gap: 8px; }
    .input-group { display: flex; margin-bottom: 16px; border: 1px solid #e2e8f0; border-radius: 10px; overflow: hidden; background: #f8fafc; }
    .input-group:focus-within { border-color: #10b981; }
    .input-group span { padding: 12px 16px; color: #64748b; display: flex; align-items: center; background: #f1f5f9; }
    .input-group input { border: none; padding: 12px; width: 100%; outline: none; background: transparent; font-size: 14px; }
    .btn-submit { width: 100%; padding: 12px; background: #059669; color: white; border: none; border-radius: 10px; font-weight: bold; font-size: 16px; cursor: pointer; transition: 0.2s; display: flex; align-items: center; justify-content: center; gap: 8px; text-decoration: none; text-align: center; }
    .btn-submit:hover { background: #047857; }
    .footer { text-align: center; margin-top: 25px; color: #94a3b8; font-size: 13px; }
  </style>
</head>
<body>
  <div class="login-card">
    <h2>Selamat Datang</h2>
    <p class="sub">Silakan masuk untuk melanjutkan.</p>
    
    <div class="alert">
      <i class="fa-solid fa-circle-check"></i> Anda berhasil keluar.
    </div>

    <form action="dashboard.html">
      <div class="input-group">
        <span><i class="fa-solid fa-user"></i></span>
        <input type="text" placeholder="Username" required>
      </div>
      <div class="input-group">
        <span><i class="fa-solid fa-lock"></i></span>
        <input type="password" placeholder="Password" required>
      </div>
      <button type="submit" class="btn-submit">
        <i class="fa-solid fa-right-to-bracket"></i> Masuk
      </button>
    </form>

    <div class="footer">
      &copy; 2026 BPSTI — Pondok Pesantren Sidogiri
    </div>
  </div>
</body>
</html>
