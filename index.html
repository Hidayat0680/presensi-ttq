<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Presensi TTQ Sidogiri</title>
<link rel="stylesheet" href="style.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
</head>
<body>
<div id="loginScreen" class="login-screen">
  <div class="login-box">
    <h1>🌙 TTQ SIDOGIRI</h1>
    <p>Cabang Pasuruan</p>
    <input type="text" id="loginUser" placeholder="Username (admin)">
    <input type="password" id="loginPass" placeholder="Password (admin123)">
    <button class="btn btn-primary" style="width:100%;margin-top:10px" onclick="doLogin()">🔐 LOGIN (atau tekan ENTER)</button>
    <button class="btn" style="width:100%;margin-top:10px;background:#eee;color:#333" onclick="resetLogin()">♻️ RESET LOGIN JIKA GAGAL</button>
    <p style="font-size:12px;margin-top:15px;color:#666">Default:<br><b>admin / admin123</b></p>
    <div id="loginError" style="color:red;margin-top:10px;font-weight:bold"></div>
  </div>
</div>
<div id="app" style="display:none">
<div class="header">
  <div style="display:flex;justify-content:space-between;align-items:center">
    <div><h1 style="margin:0;font-size:20px">🌙 PRESENSI TTQ SIDOGIRI</h1><small>Login: <b id="infoUser"></b> (<span id="infoRole"></span>)</small></div>
    <button class="btn btn-danger btn-sm" onclick="doLogout()">LOGOUT</button>
  </div>
</div>
<div class="tabs">
  <button class="tab active" onclick="openTab('presensi')">Presensi</button>
  <button class="tab" onclick="openTab('master')">Master</button>
  <button class="tab" onclick="openTab('laporan')">Laporan</button>
  <button class="tab" id="tabPenggunaBtn" onclick="openTab('pengguna')">Pengguna</button>
</div>
<div id="tab-presensi" class="tab-content active">
  <div class="card"><h3>Ketik IDPPS + ENTER</h3><input type="text" id="inputIDPPS" placeholder="IDPPS + ENTER..."><div id="scanResult"></div></div>
  <div class="card"><div class="card-head"><h3>Hari Ini: <span id="tglHariIni"></span></h3><span id="jumlahHadir">0</span></div><div class="table-wrap"><table><thead><tr><th>Jam</th><th>IDPPS</th><th>Nama</th><th>Aksi</th></tr></thead><tbody id="tabelHadirHariIni"></tbody></table></div><div class="actions"><button class="btn btn-warning" onclick="hapusHariIni()">Hapus Hari Ini</button><button class="btn btn-danger" onclick="hapusSemuaPresensi()">Hapus SEMUA</button></div></div>
</div>
<div id="tab-master" class="tab-content"><div class="card"><h3>Data Santri</h3><p>Total: <b id="totalSantri">0</b></p><div class="actions"><label class="btn btn-primary">Import Excel<input type="file" id="fileExcel" accept=".xlsx,.xls" hidden></label><button class="btn btn-danger" onclick="hapusSemuaSantri()">Hapus Semua Santri</button></div><input type="text" id="cariSantri" placeholder="Cari..." onkeyup="renderMaster()"><div class="table-wrap"><table><thead><tr><th>IDPPS</th><th>Nama</th><th>Aksi</th></tr></thead><tbody id="tabelMaster"></tbody></table></div></div></div>
<div id="tab-laporan" class="tab-content"><div class="card"><h3>Laporan</h3><input type="date" id="filterTanggal"><button class="btn btn-success" onclick="exportExcel()">Export Excel</button><div class="table-wrap"><table><thead><tr><th>Tgl</th><th>IDPPS</th><th>Nama</th><th>Jam</th><th>Aksi</th></tr></thead><tbody id="tabelLaporan"></tbody></table></div></div></div>
<div id="tab-pengguna" class="tab-content"><div class="card"><h3>Pengguna</h3><div style="background:#f9fafb;padding:12px;border-radius:8px"><input type="text" id="newUser" placeholder="Username baru"><input type="text" id="newNama" placeholder="Nama Lengkap"><input type="password" id="newPass" placeholder="Password"><select id="newRole" style="width:100%;padding:12px;border:2px solid #d1fae5;border-radius:8px;margin:10px 0"><option value="petugas">Petugas</option><option value="admin">Admin</option></select><button class="btn btn-primary" onclick="tambahUser()">Tambah Pengguna</button></div><div class="table-wrap"><table><thead><tr><th>Username</th><th>Nama</th><th>Role</th><th>Aksi</th></tr></thead><tbody id="tabelPengguna"></tbody></table></div></div></div>
</div>
<script src="app.js"></script>
</body>
</html>
