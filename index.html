<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Presensi TTQ Sidogiri - Pasuruan</title>
<link rel="stylesheet" href="style.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
</head>
<body>
<div class="header">
  <h1>🌙 PRESENSI TTQ SIDOGIRI</h1>
  <p>Cabang Pasuruan - Sistem ENTER</p>
</div>
<div class="tabs">
  <button class="tab active" onclick="openTab('presensi')">Presensi (ENTER)</button>
  <button class="tab" onclick="openTab('master')">Data Master</button>
  <button class="tab" onclick="openTab('laporan')">Laporan</button>
</div>
<div id="tab-presensi" class="tab-content active">
  <div class="card">
    <h3>Scan / Ketik IDPPS + ENTER</h3>
    <input type="text" id="inputIDPPS" placeholder="Ketik IDPPS lalu tekan ENTER..." autofocus>
    <div id="scanResult"></div>
  </div>
  <div class="card">
    <div class="card-head">
      <h3>Rekap Hari Ini: <span id="tglHariIni"></span></h3>
      <span id="jumlahHadir">0 Hadir</span>
    </div>
    <div class="table-wrap">
      <table>
        <thead><tr><th>Jam</th><th>IDPPS</th><th>Nama</th><th>Aksi</th></tr></thead>
        <tbody id="tabelHadirHariIni"></tbody>
      </table>
    </div>
    <div class="actions">
      <button class="btn btn-warning" onclick="hapusHariIni()">🗑️ Hapus Presensi Hari Ini Saja (Uji Coba)</button>
      <button class="btn btn-danger" onclick="hapusSemuaPresensi()">❌ Hapus SEMUA Riwayat Presensi</button>
    </div>
  </div>
</div>
<div id="tab-master" class="tab-content">
  <div class="card">
    <h3>Data Santri (280)</h3>
    <p>Total: <b id="totalSantri">0</b> santri</p>
    <div class="actions">
      <label class="btn btn-primary">📥 Import Excel<input type="file" id="fileExcel" accept=".xlsx,.xls" hidden></label>
      <button class="btn btn-danger" onclick="hapusSemuaSantri()">❌ Hapus Semua Data Santri</button>
    </div>
    <input type="text" id="cariSantri" placeholder="Cari nama / IDPPS..." onkeyup="renderMaster()">
    <div class="table-wrap">
      <table>
        <thead><tr><th>IDPPS</th><th>Nama Santri</th><th>Aksi</th></tr></thead>
        <tbody id="tabelMaster"></tbody>
      </table>
    </div>
  </div>
</div>
<div id="tab-laporan" class="tab-content">
  <div class="card">
    <h3>Laporan & Export</h3>
    <input type="date" id="filterTanggal">
    <button class="btn btn-success" onclick="exportExcel()">📤 Export Excel Laporan</button>
    <div class="table-wrap">
      <table>
        <thead><tr><th>Tanggal</th><th>IDPPS</th><th>Nama</th><th>Jam Hadir</th><th>Aksi</th></tr></thead>
        <tbody id="tabelLaporan"></tbody>
      </table>
    </div>
    <div class="actions">
      <button class="btn btn-warning" onclick="hapusTanggalTerpilih()">🗑️ Hapus Data Tanggal Ini Saja</button>
      <button class="btn btn-danger" onclick="hapusSemuaPresensi()">❌ Hapus SEMUA Data Presensi</button>
    </div>
  </div>
</div>
<script src="app.js"></script>
</body>
</html>
